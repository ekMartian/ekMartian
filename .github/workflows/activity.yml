name: Refresh contribution activity

on:
  schedule:
    - cron: '23 03 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'ekMartian/ekMartian' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      snapshot: ${{ steps.collect.outputs.snapshot }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot=$(python3 scripts/activity.py collect)
          printf 'snapshot=%s\n' "$snapshot" >> "$GITHUB_OUTPUT"

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate and publish aggregate files
        env:
          SNAPSHOT: ${{ needs.collect.outputs.snapshot }}
        run: |
          printf '%s' "$SNAPSHOT" | python3 scripts/activity.py apply
          python3 scripts/activity.py check
          git add -- data/activity.json assets/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh GitHub contribution activity'
          git push
