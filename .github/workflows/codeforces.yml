name: Refresh Codeforces card

on:
  schedule:
    - cron: '43 04 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'ekMartian/ekMartian' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Refresh and validate Codeforces data
        run: |
          python3 -m scripts.codeforces refresh
          python3 -m scripts.codeforces check
          git add -- data/codeforces.json assets/codeforces.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Codeforces card'
          git push
